<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>carbo — a tiny virtual cat</title>
    <meta
      name="description"
      content="A zero-dependency TypeScript library modelling a cat with drifting needs, moods, and interactions she may decline. Starring the real Carbo, close enough to touch."
    />
    <meta property="og:title" content="carbo — a tiny virtual cat" />
    <meta
      property="og:description"
      content="Hold still and she comes closer. Feed her, play with her, pet her. She may decline."
    />
    <meta property="og:image" content="./assets/poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0908" />
    <link rel="icon" href="./assets/carbo.jpg" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body data-mood="content" data-asleep="false" data-phase="opening">
    <!--
      You are inside the tube she is looking into, and the window is your
      screen: both clips are laid out by JS so that the hole in the footage is
      wider than the viewport (see layout() in app.js), which is what puts her
      face over the whole page instead of in a small round frame in the middle.

      .room carries the parallax and the shake, so a contact moves the whole
      world rather than one element.
    -->
    <!--
      The page behind the clip: the same frame at 32x57, blown up under a heavy
      blur and darkened. The clip no longer covers the window — see fill in
      app.js — and this is what its edges melt into, so there is still no line
      anywhere that says "video".
    -->
    <canvas
      id="ambient"
      class="ambient"
      width="32"
      height="57"
      aria-hidden="true"
    ></canvas>

    <div class="room" id="room">
      <video
        id="her"
        class="clip"
        src="./carbo1.mp4"
        poster="./assets/frame.jpg"
        muted
        playsinline
        preload="auto"
        aria-hidden="true"
      ></video>
      <!--
        Two seconds of the second clip: her paw arriving over the lens, twice.
        It only ever appears during a contact, cross-faded in under the shake.
      -->
      <video
        id="paw"
        class="clip"
        src="./carbo2.mp4"
        muted
        playsinline
        preload="auto"
        aria-hidden="true"
      ></video>
    </div>

    <!-- The rim of the tube: dark, close, tinted by whatever is on screen. -->
    <div class="tube" aria-hidden="true"></div>
    <!-- Dipped over a cut, so the jump between two beats is not a jolt. -->
    <div class="blink" id="blink" aria-hidden="true"></div>
    <!-- Warmth of a nose or a paw landing on you. -->
    <div class="warmth" id="warmth" aria-hidden="true"></div>
    <!-- Shut until the footage is ready, then it opens like an eye. -->
    <div class="lid" id="lid" aria-hidden="true"></div>

    <div class="zzz" id="zzz" aria-hidden="true">z &nbsp;z &nbsp;z</div>
    <p class="bubble" id="bubble" role="status" aria-live="polite"></p>

    <!-- Her name, and nothing else: the page is her face. -->
    <header class="masthead">
      <h1>carbo</h1>
    </header>

    <p class="hint" id="hint">Hold still. She comes closer.</p>

    <div class="controls">
      <button
        type="button"
        id="soundBtn"
        class="chip"
        aria-pressed="false"
        title="Purring"
      >
        <span aria-hidden="true">♪</span><span class="sr">purring</span>
      </button>
      <button
        type="button"
        id="panelBtn"
        class="chip"
        aria-expanded="false"
        aria-controls="hud"
      >
        <em id="chipMood">content</em>
        <span aria-hidden="true" class="chev">▲</span>
      </button>
    </div>

    <footer class="hud" id="hud">
      <div class="readout">
        <strong id="mood">content</strong>
        <span id="meta">kitten · 84.0 days · perfectly fine</span>
      </div>

      <dl class="stats">
        <div class="stat" data-key="hunger">
          <dt>hunger</dt>
          <dd><span class="bar"><i></i></span></dd>
        </div>
        <div class="stat" data-key="energy">
          <dt>energy</dt>
          <dd><span class="bar"><i></i></span></dd>
        </div>
        <div class="stat" data-key="affection">
          <dt>affection</dt>
          <dd><span class="bar"><i></i></span></dd>
        </div>
        <div class="stat" data-key="boredom">
          <dt>boredom</dt>
          <dd><span class="bar"><i></i></span></dd>
        </div>
      </dl>

      <div class="actions">
        <button type="button" data-action="feed" data-food="wet">wet food</button>
        <button type="button" data-action="feed" data-food="tuna">tuna</button>
        <button type="button" data-action="feed" data-food="treat">treat</button>
        <button type="button" data-action="play">play</button>
        <button type="button" data-action="pet">pet</button>
        <button type="button" data-action="toggle-sleep" id="sleepBtn">nap</button>
      </div>

      <div class="meta-actions">
        <a href="https://github.com/CARBO_REPO_SLUG">source</a>
        <button type="button" id="reset" class="linkish">start over</button>
      </div>

      <p class="log" id="log"></p>
    </footer>

    <script type="module" src="./app.js"></script>
    <noscript>
      <p class="noscript">
        This page is a live instance of the <code>carbo</code> library, so it
        needs JavaScript.
      </p>
    </noscript>
  </body>
</html>
