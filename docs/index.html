<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>carbo — a tiny virtual cat</title>
    <meta
      name="description"
      content="A zero-dependency TypeScript library modelling a cat with drifting needs, moods, and interactions she may decline. Starring the real Carbo."
    />
    <meta property="og:title" content="carbo — a tiny virtual cat" />
    <meta
      property="og:description"
      content="Feed her, play with her, pet her. She may decline."
    />
    <meta property="og:image" content="./assets/poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./assets/carbo.jpg" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body data-mood="content" data-asleep="false">
    <!--
      Full window height, centred, and never played on its own: the cursor's
      horizontal position is the playhead, so moving your hand runs the camera
      back and forth. See app.js for why this beats jumping to whichever frame
      had the tube nearest the cursor.
    -->
    <!--
      The page's background is the current frame itself: a 32x57 canvas redrawn
      from the video and blown up under a heavy blur. A static image behind a
      clip being scrubbed drifts out of tone with it, and that mismatch is what
      makes the edge of the video visible.
    -->
    <canvas id="ambient" class="ambient" width="32" height="57" aria-hidden="true"></canvas>

    <video
      id="video"
      src="./carbo1.mp4"
      poster="./assets/poster.jpg"
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>

    <div class="zzz" id="zzz" aria-hidden="true">z &nbsp;z &nbsp;z</div>
    <p class="bubble" id="bubble" role="status" aria-live="polite"></p>

    <header class="masthead">
      <h1>carbo</h1>
      <p class="tagline">
        A tiny virtual cat, modelled after a real kitten of the same name.
      </p>
      <code class="install">npm install carbo</code>
      <p class="hint" id="hint">
        Move your cursor left and right. Click her to pet.
      </p>
    </header>

    <footer class="hud" id="hud">
      <div class="readout">
        <strong id="mood">content</strong>
        <span id="meta">kitten · 84.0 days · perfectly fine</span>
      </div>

      <dl class="stats">
        <div class="stat" data-key="hunger">
          <dt>hunger</dt>
          <dd><span class="bar"><i></i></span></dd>
        </div>
        <div class="stat" data-key="energy">
          <dt>energy</dt>
          <dd><span class="bar"><i></i></span></dd>
        </div>
        <div class="stat" data-key="affection">
          <dt>affection</dt>
          <dd><span class="bar"><i></i></span></dd>
        </div>
        <div class="stat" data-key="boredom">
          <dt>boredom</dt>
          <dd><span class="bar"><i></i></span></dd>
        </div>
      </dl>

      <div class="actions">
        <button type="button" data-action="feed" data-food="wet">wet food</button>
        <button type="button" data-action="feed" data-food="tuna">tuna</button>
        <button type="button" data-action="feed" data-food="treat">treat</button>
        <button type="button" data-action="play">play</button>
        <button type="button" data-action="pet">pet</button>
        <button type="button" data-action="toggle-sleep" id="sleepBtn">nap</button>
      </div>

      <div class="meta-actions">
        <a href="https://github.com/CARBO_REPO_SLUG">source</a>
        <button type="button" id="reset" class="linkish">start over</button>
      </div>

      <p class="log" id="log"></p>
    </footer>

    <script type="module" src="./app.js"></script>
    <noscript>
      <p class="noscript">
        This page is a live instance of the <code>carbo</code> library, so it
        needs JavaScript.
      </p>
    </noscript>
  </body>
</html>
